[package]
name = "pocket"
version = "0.2.3"
edition = "2021"
authors = ["Pocket contributors"]
description = "A lightweight, privacy-first Windows companion for capturing text and voice notes."
license = "MIT"
repository = "https://github.com/emadmohagheghi/Pocket"
homepage = "https://github.com/emadmohagheghi/Pocket"

[lib]
name = "pocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
zip = { version = "=8.6.0", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }

[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
